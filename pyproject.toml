[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remy"
version = "0.1.0"
description = "Local macOS meal planning CLI powered by Foundation Models"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.0.0",
]

[project.scripts]
remy = "remy.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.format]
max-line-length = 180